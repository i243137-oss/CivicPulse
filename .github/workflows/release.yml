name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: GitHub Release & Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CivicPulse Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
